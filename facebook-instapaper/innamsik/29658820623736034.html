<p>이번달 컬럼과 지난주 인터뷰 영상. 글은 원론을, 영상은 각론을 이야기했다. 맥락상 연결된다. (댓글 링크)</p>
<p>이기지 못하는 전쟁을 일단 지지 않는 전쟁으로 끌고가야 하는데. 지금 상황은 약간 비관적.</p>
<p>그나저나.</p>
<p>시간이 갈수록 글은 부서지고 말은 흩어지는 느낌.</p>
<p>여기에... 나이들수록 탐관오리 이미지가 짙어진다.</p>
