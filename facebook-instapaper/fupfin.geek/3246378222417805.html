<h1>박성철: 요즘 페이블은 거의 안 쓰는 것 같다.</h1>
<p class="byline">박성철</p>
<time datetime="2026-08-21T12:50:00+00:00">2026-08-21T12:50:00+00:00</time>
<p>요즘 페이블은 거의 안 쓰는 것 같다.</p>
<p>오퍼스 5 중간에서 고급 정도로 염가에 대부분의 작업을 문제 없이 처리하고 있다. 덕분에 예전보다 토큰 한도 대비 사용률이 대폭 줄었다.</p>
<p>최근 7일 사용 모델 통계를 보니 오퍼스 5가 75.3%, 오퍼스 4.8이 17%, 하이쿠가 7.6%이다. 페이블과 소네트은 전혀 쓰이지 않았다.</p>
