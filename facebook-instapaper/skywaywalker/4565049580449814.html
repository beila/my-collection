<p class="post-title">Namhee Kim: 자벨 샴스.</p>
<p class="byline">Namhee Kim</p>
<p class="published-time">Posted on 2026-11-22 15:09 UTC <time datetime="2026-11-22T15:09:41+00:00"></time></p>
<p>오만의 지붕이자 그랜드캐년으로 불리는 곳.</p>
<p>3009미터.</p>
<p>샤미아와 나는 차로 가서 2천미터에서 협곡을 내려다만 보고 왔다. 다음엔 꼭 ‘발코니 워크’를 하리라 결심하면서.</p>
<p>도중에는 버려진 마을 미스파, 산과 야자나무와 마을의 경계가 아름다운 함라 마을에도 들르고, 가이드 압둘라의 집에서 점심도 먹었다.</p>
<p>#나홀로여행오만</p>
<p>#자벨샴스</p>
