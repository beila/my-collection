<h1>Sanghyun Park: 아이들은 이런 거 신경쓰지 않는다.</h1>
<p class="byline">Sanghyun Park</p>
<time datetime="2026-08-03T11:19:55+00:00">2026-08-03T11:19:55+00:00</time>
<p>아이들은 이런 거 신경쓰지 않는다. 자기가 싫으면 ”내가 싫다“고 말하면 된다. 아이들을 위하는 것처럼 말하는 화법은 미국에서도 많이 하는데, 남자가 남자 손을 잡는 거 아이들이 보면 뭐라고 설명하냐는 식.</p>
<p>아이들은 그런가보다 한다.</p>
