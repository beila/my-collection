<p>혼다가 엠블럼을 바꿨는데, 참 잘 만들었다. 오래된 엠블럼을 어쩌면 이렇게 깔끔하게 업데이트해서 쓰는지..</p>
<p>현대도 이제 좀 바꿨으면 좋겠다. 타원형 H는 요즘 현대차 디자인 흐름과 너무 동떨어져서 붙여놓으면 따로 노는 느낌.</p>
