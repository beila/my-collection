<p class="byline">Sanghyun Park</p>

<p>2년만에 다시 찾은 베니스.</p>
<p>지난 번과는 다른 호텔이지만, 비슷한 위치에 있어서 리알토에서 내려서 오는 길도 똑같고, 똑같은 곳에서 똑같은 골목을 지나쳤다. (길이라기보다는 그냥 두 건물 사이의 틈.)</p>
<p>제프 골드블룸 같이 생긴 매니저가 엄청 자세하게 주변을 설명해 줌.</p>
