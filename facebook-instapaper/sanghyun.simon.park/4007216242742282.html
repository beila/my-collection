    <p>단, 신라면의 맵기는 누구나 알고 있지만, 여의도가 정확히 얼마나 넒은지 아는 사람은 거의 없다. 여의도 면적은 여의도에서 일하던 언론인들이 만들어 낸 단위라는 게 내 추측.</p>
