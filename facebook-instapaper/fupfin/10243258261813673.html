<time datetime="2026-08-09T04:19:45+00:00">2026-08-09T04:19:45+00:00</time>
<p>미금역에 팀 홀튼이 들어왔다. 원래 있던 카페가 문 닫은 지 반년 정도 지난 후에 이 카페(도넛집?)가 들어 선 것이다.</p>
<p>한국 버거킹은 무슨 돈으로 이렇게 매장을 마구 여는 것인지 모르겠다. 직영이 아니라 가맹점인 건가?</p>
<p>암튼, 역삼을 떠나고 가끔 팀 홀튼 도넛이 생각 나곤 했는데 반갑다.</p>
