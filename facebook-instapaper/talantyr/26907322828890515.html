<p>그래서 한편으로 로버트 벤투리 같은 건축가의 정신 지평이 이해된다. 그의 스승 격인 루이스 칸의 기이한 명언이 있다. '건축은 좋은 공간과 함께 나쁜 공간도 가져야 한다. 부분의 부적합성은 전체의 적합성일 수 있다'</p>
<p>시점을 생각하면 실로 비범하지만 오늘날에는 공부 조금만 하면 쉽게 닿을 수 있다. 오히려 매우 비범한 점은 그 해법이다.</p>
