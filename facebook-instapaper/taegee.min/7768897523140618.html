<h1>Taegee Min: 2005년 MBC드라마 &lt;신돈&gt;의 한 장면.</h1>
<p class="byline">Taegee Min</p>
<time datetime="2024-03-01T23:35:00+00:00">2024-03-01T23:35:00+00:00</time>
<p>2005년 MBC드라마 &lt;신돈&gt;의 한 장면. 세상을 바꾸겠다는 신돈의 피끓는 얘기에 큰 스님(오현경)은 이렇게 타이른다. ”설마하니 부처님께서 아름다운 세상이 그리 쉽게 올 거라 여기셨을까? 부처님께서도 꿈을 꾸신게야. 그 꿈이 아름다우니 사람들도 그 꿈을 믿고 의지하는 게 아니겠느냐.“ 고인의 명복을 빕니다. #오현경배우</p>
