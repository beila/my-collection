<h1>Taegee Min: 교세라 홈페이지에 있는 글.</h1>
<p class="byline">Taegee Min</p>
<time datetime="2022-08-30T21:17:00+00:00">2022-08-30T21:17:00+00:00</time>
<p>교세라 홈페이지에 있는 글. 우장춘 박사와의 인연이 소개되어 있다. 그는 우장춘의 딸과 결혼할때 많은 격려를 받았고, 몇달 뒤 교세라를 창업했다. 그래서 굳이 교세라의 홈페이지에 그 사연을 소개한 것이다. 그리고 여기엔 박지성과의 인연도 소개되어 있다(세번째 사진). RIP 이나모리 가즈오.</p>
<p>.</p>
