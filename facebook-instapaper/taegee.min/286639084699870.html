<time datetime="2011-11-06T17:11:00+00:00">2011-11-06T17:11:00+00:00</time>
<p>20세에 요절한 세종대왕의 5남 광평대군. 그의 증손이 성종때 건축한 한옥 필경재는 19대째 종가집으로 현재 가장 잘나가는 한정식집 중의 하나이다. 한편, 광평대군의 후손으로는 헤이그 밀사사건의 이범진, 이위종 (이범진의 아들) 등이 있다.</p>
