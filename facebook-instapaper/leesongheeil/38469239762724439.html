<p>이런 경우는 처음이다. 지난 강의에서 시간에 쫓겨 미처 다 하지 못한 이야기를 이어서 들려주기 바란다며, 백제고도정책연구원에서 다시 강의를 요청했다. 그래서 이른 아침 부여에 다시 왔다. 하고 싶은 말을 마저 할 수 있게 자리를 깔아주시다니, 넉넉한 배려에 감사할 따름.</p>
