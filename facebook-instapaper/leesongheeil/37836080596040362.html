<h1>희일이송: 성공회 남양주성생원 교회.</h1>
<p class="byline">희일이송</p>
<time datetime="2026-08-20T13:06:09+00:00">2026-08-20T13:06:09+00:00</time>
<p>성공회 남양주성생원 교회. 강의 끝나고 함께 기후정의행진 포스터를 들고 사진을 찍었다.</p>
<p>성공회 교인뿐 아니라, 남양주에서 활동하는 시민단체 회원들, 그리고 농부들과 함께한 자리였다. 두 손 가득 채소 선물도 주시고 내 책도 판매해주시고, 따뜻한 환대로 횡재한 날. 남양주는 멋진 동네구나.</p>
