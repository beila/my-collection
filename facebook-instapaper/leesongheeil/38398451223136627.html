<h1>희일이송: &lt;담요를 입은 사람&gt; 관객과의 대화.</h1>
<p class="byline">희일이송</p>
<time datetime="2026-09-12T09:03:46+00:00">2026-09-12T09:03:46+00:00</time>
<p>&lt;담요를 입은 사람&gt; 관객과의 대화. 박정미 감독이 말씀을 참 잘하신다. 왜 머리를 잘랐냐는 관객의 질문에, 불가에서 긴 머리는 ‘무명초’라고 부르고 세속적 번뇌를 의미하는데, 막상 자르고 나니 신경도 덜 쓰고 시원하다고 대답. 확실히 영화처럼 범상치 않은 분.</p>
<p>페친 여러 분들이 영화도 보러 오시고 책도 선물로 나눠주셨다. 감사한 토요일 오후.</p>
