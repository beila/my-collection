<h1>희일이송: 요즘은 부자가 된 것 같다.</h1>
<p class="byline">희일이송</p>
<p class="published-time">Posted on 2026-10-29 06:31 UTC <time datetime="2026-10-29T06:31:27+00:00"></time></p>
<p>요즘은 부자가 된 것 같다. 한 번 카드를 긁을 때마다 수백만 원씩 돈을 호탕하게 소비하다니, 엄청 돈 많은 대장부 같고 좋다. 오늘도 치과 의자 위에서 몸부림치다 두 번 울었고 치료비 수백만 원을 긁었다. 통장 잔고는 바싹 말라가지만 부자처럼 꺼드럭대며 병원을 나왔다. 여러분, 이 아프면 얼른 치과 가세요. 안 그러면 저처럼 부자됩미다.</p>
