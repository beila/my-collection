<h1>희일이송: 오늘의 강의는 아산시 도고면에 있는 도고성당에서.</h1>
<p class="byline">희일이송</p>
<p class="published-time">Posted on 2026-10-28 08:25 UTC <time datetime="2026-10-28T08:25:36+00:00"></time></p>
<p>오늘의 강의는 아산시 도고면에 있는 도고성당에서. 산꼭대기에 위치해 있어 전망이 근사하다. 성당도 예쁘고.</p>
<p>농사 짓는 어르신들이 많다고 해서 집중이 어렵지 않을까 걱정했는데 편견이었다. 웬만한 강의보다 집중력이 높아서 놀란. 덕분에 나도 점점 더 쉽게 말하는 법을 배워가는 것 같다.</p>
