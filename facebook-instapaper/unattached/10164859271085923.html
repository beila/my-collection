<h1>Jake Deschain: 1989년 영화 [인디애나 존스]에서 사용된 나치 제복은 진품이다.</h1>
<p class="byline">Jake Deschain</p>
<time datetime="2026-09-16T13:40:01+00:00">2026-09-16T13:40:01+00:00</time>
<p>1989년 영화 [인디애나 존스]에서 사용된 나치 제복은 진품이다. 휴고 보스에서 1930-1940년대에 만든 옷을 의상 담당자가 직접 구해왔다.</p>
<p>휴고 보스에서 디자인까지 한 건 아니고 생산을 책임졌다.</p>
