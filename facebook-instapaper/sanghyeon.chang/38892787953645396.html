<h1>Sanghyeon Chang: 트럼프의 욕심은 지구에서 머물지 않는다.</h1>
<p class="byline">Sanghyeon Chang</p>
<time datetime="2026-09-07T03:59:18+00:00">2026-09-07T03:59:18+00:00</time>
<p>트럼프의 욕심은 지구에서 머물지 않는다. 트럼프는 이런 유치한 글을 매일밤 수십개씩 올리고 있는데 (상당수는 비서 나탈리 하프가 올리고 있지만) 진짜 한가한 모양이다. 저 사진 모두 몇 시간 전에 올린 것 들 중 1/10 정도</p>
