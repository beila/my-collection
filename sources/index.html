<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Instapaper · Automatic sources</title>
<style>
:root {
  --paper: oklch(97% .014 85); --panel: oklch(99% .006 85);
  --ink: oklch(26% .025 54); --muted: oklch(49% .025 60);
  --accent: oklch(47% .15 32); --tint: oklch(92% .034 48);
  --line: oklch(85% .02 75); --error: oklch(43% .16 25);
  --sans: "Avenir Next", Avenir, "Trebuchet MS", "Noto Sans", sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  color-scheme: light; font-family: var(--sans); color: var(--ink); background: var(--paper);
}
* { box-sizing: border-box; }
body { margin: 0; min-width: 320px; min-height: 100dvh; padding-bottom: 24px; color: var(--ink); background: var(--paper); }
button, input, select { font: inherit; color: inherit; }
button, select { cursor: pointer; }
button { background: none; border: 0; }
a { color: var(--accent); text-underline-offset: 3px; overflow-wrap: anywhere; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 3px;
}
h1, h2, h3, p { margin: 0; }
button[disabled] { opacity: .45; cursor: default; }
.masthead { padding: 18px clamp(20px, 4vw, 64px); border-bottom: 1px solid var(--line); }
.topline { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1 { font-size: 21px; font-weight: 700; letter-spacing: -.03em; line-height: 1.3; }
.sync { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; color: var(--muted); font-size: 12px; }
.sync-dot { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; }
.sync button { padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; }
.toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 20px clamp(20px, 4vw, 64px) 12px; }
.search { position: relative; flex: 1; min-width: 180px; }
.search svg { position: absolute; left: 13px; top: 13px; width: 18px; height: 18px; }
.search input { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 5px; padding: 10px 44px 10px 40px; background: var(--panel); }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }
.search-clear { position: absolute; right: 8px; top: 8px; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 4px; font-size: 22px; line-height: 1; }
.search-clear:hover { background: var(--tint); }
.search-clear[hidden] { display: none; }
.toolbar select { height: 44px; min-width: 150px; max-width: 100%; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); padding: 8px 32px 8px 12px; }
.attention { display: flex; gap: 7px; align-items: center; font-size: 12px; white-space: nowrap; }
.attention input { accent-color: var(--accent); width: 16px; height: 16px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px clamp(20px, 4vw, 64px) 20px; }
.filter { display: flex; align-items: center; gap: 9px; padding: 8px 11px; border-radius: 4px; border: 1px solid var(--line); font-size: 12px; }
.filter span { font-family: var(--mono); font-size: 10px; opacity: .75; }
.filter.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.content { margin: 0 clamp(20px, 4vw, 64px); }
.results-meta { font-size: 12px; color: var(--muted); margin-bottom: 12px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.group-title { font-size: 11px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.tag { display: inline-block; padding: 3px 7px; background: var(--tint); color: var(--ink); border-radius: 3px; font-size: 10px; line-height: 1.5; }
.tag.error { color: var(--error); background: color-mix(in oklch, var(--error) 10%, var(--panel)); }
.empty { padding: 48px 24px; color: var(--muted); font-size: 14px; line-height: 1.7; text-align: center; }
.notice { margin: 0 clamp(20px, 4vw, 64px) 16px; padding: 12px 16px; border: 1px solid var(--line); line-height: 1.6; font-size: 12px; }
.notice.error { color: var(--error); }
.room { display: grid; grid-template-columns: minmax(260px, .9fr) minmax(0, 1.3fr); border-top: 1px solid var(--line); min-height: 550px; }
.catalog-list { max-height: 71dvh; overflow: auto; overscroll-behavior: contain; padding-right: 24px; }
.catalog-group { padding-top: 22px; }
.catalog-group > .group-title { margin-bottom: 10px; }
.source-row { width: 100%; display: block; text-align: left; border-bottom: 1px solid var(--line); padding: 16px 12px; border-radius: 0; }
.source-row:hover { background: var(--tint); }
.source-row.selected { background: var(--tint); }
.row-name { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-weight: 700; font-size: 15px; }
.row-name .arrow { color: var(--accent); font-size: 20px; }
.row-sub { display: block; color: var(--muted); margin-top: 5px; font-size: 11px; line-height: 1.5; }
.row-preview { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); font-size: 12px; line-height: 1.5; margin-top: 7px; }
.room-detail { background: var(--panel); border: 1px solid var(--line); border-top: 0; padding: clamp(22px, 3vw, 44px); min-width: 0; scroll-margin-top: 16px; }
.detail-title { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; margin: 14px 0 9px; }
.detail-title h2 { font: 400 clamp(27px, 3vw, 40px)/1.15 var(--serif); letter-spacing: -.03em; overflow-wrap: anywhere; }
.detail-link { font-size: 12px; }
.detail-kind { font-size: 12px; color: var(--muted); }
.detail-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 28px 0; padding: 22px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
dt { color: var(--muted); font-size: 10px; margin-bottom: 7px; text-transform: uppercase; letter-spacing: .08em; }
dd { margin: 0; font-size: 12px; line-height: 1.7; overflow-wrap: anywhere; }
.detail-facts .full { grid-column: 1/-1; }
.preview-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 12px 0 20px; flex-wrap: wrap; }
.preview-heading h3 { font-size: 15px; }
.preview-heading small { color: var(--muted); font-size: 10px; }
.article-preview { margin-top: 24px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
.article-preview .byline { font-size: 10px; color: var(--muted); margin-bottom: 10px; }
.article-preview h3 { font: 400 22px/1.28 var(--serif); margin-bottom: 10px; }
.article-preview h3 a { color: var(--ink); text-decoration: none; }
.article-preview h3 a:hover { text-decoration: underline; }
.article-preview p { font-size: 13px; line-height: 1.8; color: var(--muted); }
.article-preview > a { display: inline-block; font-size: 11px; margin-top: 12px; }
.preview-missing { padding: 24px 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
.editions { display: flex; flex-wrap: wrap; gap: 7px; margin: 18px 0; }
.editions a { font-size: 11px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 3px; text-decoration: none; }
.rule-error { margin-top: 12px; padding: 12px; background: color-mix(in oklch, var(--error) 8%, var(--panel)); color: var(--error); font-size: 12px; line-height: 1.6; overflow-wrap: anywhere; }
.provenance { margin-top: 22px; color: var(--muted); font-size: 10px; line-height: 1.7; }
.loading { padding: 50px; text-align: center; color: var(--muted); }
@media (max-width: 1100px) {
  .room { grid-template-columns: minmax(230px,.8fr) minmax(0,1.1fr); }
  .catalog-list { padding-right: 14px; }
}
@media (max-width: 720px) {
  .masthead { padding-top: 20px; }
  .topline { gap: 12px; }
  .sync { font-size: 10px; }
  .toolbar { gap: 10px; }
  .search { flex-basis: 100%; }
  .toolbar select { flex: 1; }
  .room { display: block; }
  .catalog-list { max-height: 350px; border-bottom: 1px solid var(--line); padding: 0 0 16px; }
  .room-detail { border-top: 1px solid var(--line); margin-top: 20px; }
}
@media (max-width: 380px) {
  .filter { font-size: 11px; }
}
</style>
</head>
<body>
<header class="masthead">
  <div class="topline">
    <h1>Instapaper sources</h1>
    <div class="sync"><span class="sync-dot" aria-hidden="true"></span><span id="sync-status" role="status">Loading sources…</span><button id="refresh" type="button">Refresh ↻</button></div>
  </div>
</header>
<div class="toolbar" role="search" aria-label="Filter sources">
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg>
    <input id="search" type="search" placeholder="Find a source, topic, or article…" aria-label="Search sources">
    <button id="clear-search" class="search-clear" type="button" aria-label="Clear search" title="Clear search" hidden>×</button>
  </div>
  <select id="destination" aria-label="Filter by destination"><option value="">All destinations</option></select>
  <label class="attention"><input id="attention" type="checkbox">Source errors only</label>
</div>
<nav class="filters" id="filters" aria-label="Monitoring frequency"></nav>
<div id="notices"></div>
<main class="content" id="content"><p class="loading">Loading your sources and cached previews…</p></main>
<script>
const groups = [
  {id:"frequent", name:"Every ~15 min", short:"15 min", note:"Direct feeds. Each maintenance pass looks for new matching articles."},
  {id:"hourly", name:"About hourly", short:"Hourly", note:"Feeds and page sources for 다읽기. Delivered in batches to Smith."},
  {id:"daily", name:"Daily rotation", short:"Daily", note:"One newest eligible newsletter across the whole rotation each day."},
  {id:"facebook", name:"Facebook queue", short:"24 h cooldown", note:"Enabled profiles share the acquisition queue. Delivery follows capture."},
  {id:"conditional", name:"When triggered", short:"On condition", note:"Saved links, request tags, folder contents, and reading progress."}
];
const params = new URLSearchParams(location.search);
const state = {data:null, filter:"", search:"", destination:"", attention:false, selected:params.get("source")||"", fetching:false};
const esc = value => String(value??"").replace(/[&<>"']/g, char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
const groupOf = id => groups.find(group=>group.id===id);
function date(value) {
  if (!value) return "";
  const parsed = new Date(value);
  return Number.isNaN(parsed.getTime()) ? "" : new Intl.DateTimeFormat("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",timeZone:"Europe/London"}).format(parsed)+" London";
}
function tag(source) {
  if (source.error) return '<span class="tag error">Source error</span>';
  if (source.next_in_rotation) return '<span class="tag">Next in rotation</span>';
  return '<span class="tag">'+esc(source.folder)+'</span>';
}
function matches() {
  const needle=state.search.toLocaleLowerCase();
  return state.data.sources.filter(source=>
    (!state.filter||source.group===state.filter) &&
    (!state.destination||source.folder===state.destination) &&
    (!state.attention||source.error) &&
    (!needle||[source.name,source.kind,source.rule,source.folder,...source.previews.map(item=>item.title)].join(" ").toLocaleLowerCase().includes(needle))
  );
}
function byName(a,b) { return a.name.localeCompare(b.name,undefined,{sensitivity:"base"}); }
function fact(label,value,full=false) { return '<div'+(full?' class="full"':'')+'><dt>'+esc(label)+'</dt><dd>'+esc(value)+'</dd></div>'; }
function details(source) {
  const editions = source.children ? '<div class="editions">'+source.children.map(child=>'<a href="'+esc(child.url)+'" target="_blank" rel="noopener noreferrer">'+esc(child.name)+' ↗</a>').join("")+'</div>' : "";
  return '<div class="detail-kind">'+esc(source.kind)+' · '+esc(groupOf(source.group).name)+'</div>'+
    '<div class="detail-title"><h2>'+esc(source.name)+'</h2>'+tag(source)+'</div>'+
    (source.url?'<a class="detail-link" href="'+esc(source.url)+'" target="_blank" rel="noopener noreferrer">Open source ↗</a>':"")+
    editions+
    '<dl class="detail-facts">'+fact("Checked",source.monitoring,true)+fact("Added when",source.rule,true)+fact("Delivered as",source.delivery,true)+fact("Destination",source.folder)+fact("Tags",source.tags.join(" ")||"No new tags")+'</dl>'+
    (source.error?'<div class="rule-error"><strong>Recorded source error</strong><br>'+esc(source.error)+'</div>':"")+
    '<div class="provenance">'+(source.config?'Configuration: '+esc(source.config)+'.<br>':"")+'Previews are saved excerpts. This page does not change bookmarks.</div>';
}
function articlePreviews(source) {
  return '<div class="preview-heading"><h3>'+(source.previews.length?"Latest available previews":"Source preview")+'</h3><small>'+(source.cached_at?"Cache checked "+esc(date(source.cached_at)):"")+'</small></div>'+
    (source.previews.length ? source.previews.map(item=>'<article class="article-preview"><div class="byline">'+esc([item.author,date(item.published)].filter(Boolean).join(" · ")||item.origin)+'</div><h3>'+(item.url?'<a href="'+esc(item.url)+'" target="_blank" rel="noopener noreferrer">'+esc(item.title)+'</a>':esc(item.title))+'</h3>'+(item.summary?'<p>'+esc(item.summary)+'</p>':"")+(item.url?'<a href="'+esc(item.url)+'" target="_blank" rel="noopener noreferrer">Read original ↗</a>':"")+'</article>').join("") :
    '<p class="preview-missing">'+esc(source.preview_note||"No local preview is available.")+(source.url?' <a href="'+esc(source.url)+'" target="_blank" rel="noopener noreferrer">Visit the source ↗</a>':"")+'</p>');
}
function sourceButton(source) {
  return '<button type="button" class="source-row'+(source.id===state.selected?' selected':'')+'" data-source="'+esc(source.id)+'" aria-pressed="'+(source.id===state.selected)+'"><span class="row-name"><span>'+esc(source.name)+'</span><span class="arrow" aria-hidden="true">↗</span></span><span class="row-sub">'+esc(source.kind)+' · '+esc(source.folder)+(source.error?' · Source error':"")+'</span>'+(source.previews[0]?'<span class="row-preview">'+esc(source.previews[0].title)+'</span>':"")+'</button>';
}
function room(sources,selected) {
  return '<div class="room"><div class="catalog-list" id="catalog-list">'+groups.map(group=>{
    const members=sources.filter(source=>source.group===group.id).sort(byName);
    return members.length?'<section class="catalog-group"><h2 class="group-title">'+esc(group.name)+' · '+members.length+'</h2>'+members.map(sourceButton).join("")+'</section>':"";
  }).join("")+'</div><aside class="room-detail" id="selected-preview" aria-label="Selected source preview">'+details(selected)+articlePreviews(selected)+'</aside></div>';
}
function render() {
  document.querySelector("#clear-search").hidden=!state.search;
  if (!state.data) return;
  const sources=matches();
  if (!sources.some(source=>source.id===state.selected)) state.selected=sources[0]?.id||"";
  const selected=sources.find(source=>source.id===state.selected);
  document.querySelector("#filters").innerHTML=[{id:"",name:"All sources"},...groups].map(group=>'<button type="button" class="filter'+(group.id===state.filter?' active':'')+'" data-filter="'+group.id+'" aria-pressed="'+(group.id===state.filter)+'">'+esc(group.name)+'<span>'+(group.id?state.data.counts[group.id]:state.data.sources.length)+'</span></button>').join("");
  const position=document.querySelector("#catalog-list")?.scrollTop||0;
  const body = selected ? room(sources,selected) : '<p class="empty">No sources match these filters.</p>';
  document.querySelector("#content").innerHTML='<div class="results-meta"><span id="inventory-total">'+sources.length+' of '+state.data.sources.length+' sources & rules</span><span>'+(state.data.public?"Updated with page deployments":"Refreshes when opened")+' · Times in London</span></div>'+body;
  if (document.querySelector("#catalog-list")) document.querySelector("#catalog-list").scrollTop=position;
  document.querySelector("#notices").innerHTML=state.data.warnings.length?'<div class="notice error">'+state.data.warnings.map(esc).join("<br>")+'</div>':"";
}
document.addEventListener("click",event=>{
  const source=event.target.closest("[data-source]");
  const filter=event.target.closest("[data-filter]");
  if (source) {
    state.selected=source.dataset.source; render();
    document.querySelector(".source-row.selected").focus({preventScroll:true});
    if (matchMedia("(max-width: 720px)").matches) document.querySelector("#selected-preview").scrollIntoView({block:"start"});
  }
  if (filter) { state.filter=filter.dataset.filter; render(); }
});
document.querySelector("#search").addEventListener("input",event=>{state.search=event.target.value;render();});
document.querySelector("#clear-search").addEventListener("click",()=>{
  state.search="";
  document.querySelector("#search").value="";
  render();
  document.querySelector("#search").focus();
});
document.querySelector("#destination").addEventListener("change",event=>{state.destination=event.target.value;render();});
document.querySelector("#attention").addEventListener("change",event=>{state.attention=event.target.checked;render();});
async function refresh() {
  if (state.fetching) return;
  state.fetching=true;
  document.querySelector("#refresh").disabled=true;
  try {
    const response=await fetch("./sources.json",{cache:"no-store"});
    const data=await response.json();
    if (!response.ok) throw new Error(data.error||"Could not refresh sources");
    if (!state.selected) state.selected=(data.sources.find(source=>source.name.includes("Interesting Engineering"))||data.sources.find(source=>source.previews.length)||data.sources[0])?.id||"";
    state.data=data;
    const destinations=[...new Set(data.sources.map(source=>source.folder))].sort();
    if (!destinations.includes(state.destination)) state.destination="";
    document.querySelector("#destination").innerHTML='<option value="">All destinations</option>'+destinations.map(folder=>'<option value="'+esc(folder)+'"'+(folder===state.destination?' selected':"")+'>'+esc(folder)+'</option>').join("");
    document.querySelector("#sync-status").textContent=(data.public?"Published ":"Updated ")+date(data.generated_at);
    render();
  } catch (error) {
    document.querySelector("#sync-status").textContent="Refresh failed · "+error.message;
    if (!state.data) document.querySelector("#content").innerHTML='<p class="empty">'+esc(error.message)+'</p>';
  } finally {
    state.fetching=false;
    document.querySelector("#refresh").disabled=false;
  }
}
document.querySelector("#refresh").addEventListener("click",refresh);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh();});
render(); refresh();
</script>
</body>
</html>
