name: Check public B2 image access

on:
  workflow_dispatch:
    inputs:
      verify_head:
        description: Check one legacy image with the cutover HEAD verifier
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        if: inputs.verify_head
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /.github/legacy-image-migration.json
            /nasica-blog/100/images/01.jpg
      - name: Verify a public image with HEAD
        if: inputs.verify_head
        env:
          PYTHONPATH: .github/scripts
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          from b2_image_hosting_test import NoRedirect
          from legacy_image_cutover_verify import source_sha1, verify_image_head
          from legacy_image_migration import read_inventory

          inventory = read_inventory(Path(".github/legacy-image-migration.json"))
          image = next(image for image in inventory["images"]
                       if image["original_path"] == "nasica-blog/100/images/01.jpg")
          image["sha1"] = source_sha1(Path("."), image)
          headers = verify_image_head(urllib.request.build_opener(NoRedirect()), image)
          print(json.dumps({"url": image["url"], "status": 200, "headers": headers}))
          PY
      - name: Read the B2 error response
        if: ${{ !inputs.verify_head }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import urllib.error
          import urllib.request

          base = "https://f003.backblazeb2.com/file/my-collection-images/images/v1/"
          names = (
              "0001fa485bd3032d095a17a53b42c649cb6f94edbab279c5cbf4d34aaa559e0a.jpg",
              "39ff57b607093ee99c9dbf00c7fd55524532b648e5db30d46573cad2bf55edd1.jpg",
          )
          for name in names:
              try:
                  with urllib.request.urlopen(base + name, timeout=30) as response:
                      content = response.read(32 * 1024 * 1024 + 1)
                      print(json.dumps({
                          "object": name,
                          "status": response.status,
                          "bytes": len(content),
                          "sha256": hashlib.sha256(content).hexdigest(),
                      }))
              except urllib.error.HTTPError as error:
                  body = error.read(4096).decode("utf-8", errors="replace")
                  print(json.dumps({"object": name, "status": error.code, "body": body}))
          PY
