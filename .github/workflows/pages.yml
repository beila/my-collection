name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - name: Read the latest migration checkpoint
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/read-migration-checkpoint.sh . "$RUNNER_TEMP/migration"
      - name: Prepare public artifact
        run: bash .github/scripts/prepare-pages.sh . _site
      - name: Measure the staged website
        id: measurements
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_HISTORY_URL: ${{ steps.pages.outputs.base_url }}/sources/collection.json
        run: |
          bash .github/scripts/read-pages-history.sh "$RUNNER_TEMP/pages-history" "$PUBLIC_HISTORY_URL"
          python3 .github/scripts/collection_statistics.py \
            --repo . --site _site --checkpoint-dir "$RUNNER_TEMP/migration" \
            --history .github/pages-size-history.json \
            --history "$RUNNER_TEMP/pages-history/collection.json"
      - name: Retain deployment measurements
        if: steps.measurements.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pages-size-history
          path: _site/sources/collection.json
          retention-days: 90
      - uses: actions/upload-pages-artifact@v3
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
