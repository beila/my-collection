<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#120d2d">
  <meta name="description" content="Please read on">
  <title>Marker</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #17102f;
      --violet: #3e1d75;
      --plum: #722b78;
      --rose: #ef6f8c;
      --peach: #ffb56b;
      --gold: #ffd77d;
      --cream: #fff8df;
      --paper: #fff4cf;
      --shadow: rgb(7 3 25 / 48%);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--ink);
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: clamp(1rem, 5vw, 4rem);
      color: var(--cream);
      font-family:
        "Avenir Next",
        Avenir,
        "Segoe UI",
        system-ui,
        sans-serif;
      background:
        radial-gradient(circle at 16% 18%, rgb(255 181 107 / 34%) 0 1px, transparent 2px),
        radial-gradient(circle at 82% 23%, rgb(255 215 125 / 38%) 0 1.5px, transparent 2.5px),
        radial-gradient(circle at 24% 78%, rgb(239 111 140 / 28%) 0 1px, transparent 2px),
        radial-gradient(circle at 76% 72%, rgb(255 244 207 / 24%) 0 1px, transparent 2px),
        radial-gradient(circle at 50% 45%, #722b78 0, #3e1d75 38%, #17102f 78%);
      background-size: 67px 71px, 91px 83px, 79px 73px, 113px 107px, auto;
    }

    body::before,
    body::after {
      position: fixed;
      z-index: 0;
      width: min(72vw, 48rem);
      aspect-ratio: 1;
      border: 1px solid rgb(255 215 125 / 16%);
      border-radius: 38% 62% 58% 42%;
      content: "";
      pointer-events: none;
      animation: orbit 24s linear infinite;
    }

    body::before {
      top: -37vw;
      left: -24vw;
      box-shadow:
        0 0 0 3rem rgb(239 111 140 / 4%),
        0 0 0 7rem rgb(255 181 107 / 3%);
    }

    body::after {
      right: -26vw;
      bottom: -39vw;
      animation-direction: reverse;
      animation-duration: 31s;
      box-shadow:
        0 0 0 4rem rgb(255 215 125 / 4%),
        0 0 0 9rem rgb(239 111 140 / 3%);
    }

    .marker {
      position: relative;
      z-index: 1;
      isolation: isolate;
      width: min(100%, 45rem);
      min-height: min(76vh, 45rem);
      display: grid;
      place-items: center;
      padding: clamp(3.8rem, 10vw, 7rem) clamp(2rem, 9vw, 6rem);
      text-align: center;
      background:
        linear-gradient(135deg, rgb(255 255 255 / 18%), transparent 31%),
        linear-gradient(315deg, rgb(239 111 140 / 14%), transparent 38%),
        linear-gradient(155deg, rgb(53 23 99 / 94%), rgb(28 15 63 / 97%));
      border: 1px solid rgb(255 215 125 / 52%);
      border-radius: 52% 48% 50% 50% / 8% 8% 6% 6%;
      box-shadow:
        0 2.5rem 6rem var(--shadow),
        inset 0 0 0 0.45rem rgb(255 248 223 / 4%),
        inset 0 0 4rem rgb(239 111 140 / 12%);
    }

    .marker::before,
    .marker::after {
      position: absolute;
      z-index: -1;
      left: 50%;
      width: 33%;
      height: 3.75rem;
      translate: -50% 0;
      background:
        linear-gradient(135deg, transparent 1.15rem, var(--rose) 1.2rem) left,
        linear-gradient(225deg, transparent 1.15rem, var(--rose) 1.2rem) right;
      background-size: 51% 100%;
      background-repeat: no-repeat;
      filter: drop-shadow(0 0.65rem 0.7rem rgb(10 4 35 / 35%));
      content: "";
    }

    .marker::before {
      top: -1.8rem;
    }

    .marker::after {
      bottom: -1.8rem;
      rotate: 180deg;
    }

    .frame {
      position: absolute;
      inset: 1rem;
      border: 1px solid rgb(255 215 125 / 28%);
      border-radius: inherit;
      pointer-events: none;
    }

    .frame::before,
    .frame::after {
      position: absolute;
      left: 50%;
      width: clamp(4rem, 18vw, 8rem);
      height: 1px;
      translate: -50% 0;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      content: "";
    }

    .frame::before {
      top: 2rem;
    }

    .frame::after {
      bottom: 2rem;
    }

    .corner {
      position: absolute;
      width: 3rem;
      aspect-ratio: 1;
      border-color: var(--gold);
      opacity: 0.76;
      filter: drop-shadow(0 0 0.4rem rgb(255 215 125 / 35%));
    }

    .corner:nth-of-type(1) {
      top: 2rem;
      left: 2rem;
      border-top: 2px solid;
      border-left: 2px solid;
      border-radius: 1rem 0 0;
    }

    .corner:nth-of-type(2) {
      top: 2rem;
      right: 2rem;
      border-top: 2px solid;
      border-right: 2px solid;
      border-radius: 0 1rem 0 0;
    }

    .corner:nth-of-type(3) {
      right: 2rem;
      bottom: 2rem;
      border-right: 2px solid;
      border-bottom: 2px solid;
      border-radius: 0 0 1rem;
    }

    .corner:nth-of-type(4) {
      bottom: 2rem;
      left: 2rem;
      border-bottom: 2px solid;
      border-left: 2px solid;
      border-radius: 0 0 0 1rem;
    }

    .content {
      position: relative;
      display: grid;
      justify-items: center;
      gap: clamp(1.5rem, 5vw, 2.75rem);
    }

    .seal {
      width: clamp(4.5rem, 14vw, 6.5rem);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      rotate: 45deg;
      border: 1px solid rgb(255 215 125 / 70%);
      background:
        radial-gradient(circle, var(--gold) 0 5%, transparent 6% 21%, var(--gold) 22% 24%, transparent 25%),
        linear-gradient(135deg, var(--rose), var(--peach));
      box-shadow:
        0 0 0 0.4rem rgb(255 215 125 / 8%),
        0 0 2rem rgb(239 111 140 / 40%);
    }

    .seal::before,
    .seal::after {
      grid-area: 1 / 1;
      width: 44%;
      height: 1px;
      background: var(--ink);
      content: "";
    }

    .seal::after {
      rotate: 90deg;
    }

    h1 {
      margin: 0;
      color: var(--paper);
      font-family:
        "Bodoni 72",
        Didot,
        "Times New Roman",
        serif;
      font-size: clamp(4rem, 16vw, 8.5rem);
      font-weight: 700;
      line-height: 0.8;
      letter-spacing: -0.055em;
      text-shadow:
        0.045em 0.055em 0 var(--plum),
        0 0 0.45em rgb(255 181 107 / 25%);
    }

    h1::first-letter {
      color: var(--gold);
      font-size: 1.15em;
      font-style: italic;
    }

    .message {
      position: relative;
      margin: 0;
      padding: 1rem clamp(1.5rem, 6vw, 3rem);
      color: var(--cream);
      font-size: clamp(1rem, 3vw, 1.3rem);
      font-weight: 600;
      letter-spacing: 0.22em;
      line-height: 1.6;
      text-transform: uppercase;
    }

    .message::before,
    .message::after {
      position: absolute;
      top: 50%;
      width: clamp(1.2rem, 5vw, 2.5rem);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
      content: "";
    }

    .message::before {
      right: 100%;
    }

    .message::after {
      left: 100%;
      rotate: 180deg;
    }

    .spark {
      position: absolute;
      width: 0.35rem;
      aspect-ratio: 1;
      rotate: 45deg;
      background: var(--gold);
      box-shadow: 0 0 0.8rem var(--gold);
      animation: glimmer 2.6s ease-in-out infinite alternate;
    }

    .spark:nth-child(1) {
      top: -1.5rem;
      left: 8%;
    }

    .spark:nth-child(2) {
      top: 24%;
      right: -7%;
      animation-delay: -0.9s;
    }

    .spark:nth-child(3) {
      bottom: -1.2rem;
      left: 19%;
      animation-delay: -1.7s;
    }

    @keyframes orbit {
      to {
        rotate: 360deg;
      }
    }

    @keyframes glimmer {
      from {
        scale: 0.65;
        opacity: 0.38;
      }

      to {
        scale: 1.45;
        opacity: 1;
      }
    }

    @media (max-width: 36rem) {
      .marker {
        min-height: 72vh;
        border-radius: 48% 52% 50% 50% / 5% 5% 4% 4%;
      }

      .corner {
        width: 2rem;
      }

      .corner:nth-of-type(1),
      .corner:nth-of-type(4) {
        left: 1.4rem;
      }

      .corner:nth-of-type(2),
      .corner:nth-of-type(3) {
        right: 1.4rem;
      }

      .corner:nth-of-type(1),
      .corner:nth-of-type(2) {
        top: 1.4rem;
      }

      .corner:nth-of-type(3),
      .corner:nth-of-type(4) {
        bottom: 1.4rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <article class="marker instapaper_body">
    <div class="frame" aria-hidden="true"></div>
    <i class="corner" aria-hidden="true"></i>
    <i class="corner" aria-hidden="true"></i>
    <i class="corner" aria-hidden="true"></i>
    <i class="corner" aria-hidden="true"></i>
    <div class="content">
      <i class="spark" aria-hidden="true"></i>
      <i class="spark" aria-hidden="true"></i>
      <i class="spark" aria-hidden="true"></i>
      <div class="seal" aria-hidden="true"></div>
      <h1>Marker</h1>
      <p class="message">Please read on</p>
    </div>
  </article>
</body>
</html>
